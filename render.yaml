services:
  # ====================================================
  # 1. FAIRRIDE BACKEND API & SOCKET.IO SERVER
  # ====================================================
  - type: web
    name: fairride-api
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build --workspaces
    startCommand: node apps/api/dist/server.js
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: "*"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

  # ====================================================
  # 2. FAIRRIDE WEB FRONTEND (REACT + VITE SPA)
  # ====================================================
  - type: web
    name: fairride-web
    env: static
    plan: free
    region: oregon
    buildCommand: npm install && npm run build --workspace=@fairride/web
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: fairride-api
          property: host
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
