version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: fairride-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: fairride
    volumes:
      - mongodb_data:/data/db
    networks:
      - fairride-network

  redis:
    image: redis:7.2-alpine
    container_name: fairride-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - fairride-network

  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
    container_name: fairride-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    networks:
      - fairride-network

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    container_name: fairride-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/fairride
      - REDIS_URL=redis://redis:6379
      - AI_SERVICE_URL=http://ai-service:8000
      - JWT_SECRET=fairride_jwt_super_secret_production_key_2026
      - JWT_REFRESH_SECRET=fairride_jwt_refresh_super_secret_2026
    depends_on:
      - mongodb
      - redis
      - ai-service
    networks:
      - fairride-network

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    container_name: fairride-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - fairride-network

volumes:
  mongodb_data:
  redis_data:

networks:
  fairride-network:
    driver: bridge
